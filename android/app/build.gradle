plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
    // Kotlin 2.x ships the Compose compiler as a plugin; there is no
    // composeOptions/kotlinCompilerExtensionVersion to keep in sync any more.
    alias(libs.plugins.kotlin.compose)
    alias(libs.plugins.protobuf)
}

// Load keystore properties
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = 'network.erth.wallet'
    compileSdk = 36

    defaultConfig {
        applicationId = "network.erth.wallet"
        minSdk = 24
        targetSdk = 36
        versionCode = 42
        versionName = "1.0.35"

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildFeatures {
        compose = true
    }

    buildTypes {
        release {
            // The pinned noir_android AAR ships an x86_64 libc++.so linked at a
            // 4 KB max-page-size, which Play flags as 16 KB-incompatible. That
            // pin cannot move — bb must stay in lockstep with the chain verifier
            // — and x86_64 is emulators and Chromebooks, neither of which has a
            // 16 KB page size or the NFC this app needs. arm64-v8a's copy is
            // already 16 KB aligned, so dropping the x86 ABIs fixes the warning
            // without touching the prover. Debug keeps every ABI.
            ndk {
                abiFilters 'arm64-v8a', 'armeabi-v7a'
            }
            minifyEnabled = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
        freeCompilerArgs += [
            "-opt-in=kotlin.RequiresOptIn"
        ]
    }

    testOptions {
        // bitcoinj logs through slf4j-android, which calls android.util.Log;
        // in a JVM unit test that is a stub that would otherwise throw.
        unitTests.returnDefaultValues = true
    }

    lint {
        abortOnError = false
        checkReleaseBuilds = false
    }

    sourceSets {
        debug {
            java {
                srcDirs = ['build/generated/source/proto/debug/java']
            }
        }
        release {
            java {
                srcDirs = ['build/generated/source/proto/release/java']
            }
        }
    }

    packaging {
        resources {
            excludes += ['META-INF/LICENSE*', 'META-INF/NOTICE*', 'META-INF/DEPENDENCIES', 'META-INF/INDEX.LIST']
            // BouncyCastle's multi-release overlays for newer JVMs. Android runs
            // the base classes, and each BC jar ships its own copy of these.
            excludes += ['META-INF/versions/**']
        }
    }
}

protobuf {
    protoc {
        artifact = libs.protobuf.protoc.get().toString()
    }
    // Configure generation to use the lite runtime
    generateProtoTasks {
        all().each { task ->
            task.builtins {
                            java {
                    option 'lite'
                }
            }
        }
    }
}

// One BouncyCastle: the jdk18on line declared below. The jdk15on artifacts
// stopped at 1.70, which has known denial-of-service CVEs in parsers this app
// feeds untrusted input (the passport's SOD and certificates), and any library
// that pulls them in transitively would put a second copy of the same classes
// on the classpath. So every older line is excluded app-wide.
configurations.configureEach {
    exclude group: 'org.bouncycastle', module: 'bcprov-jdk15to18'
    exclude group: 'org.bouncycastle', module: 'bcprov-jdk15on'
    exclude group: 'org.bouncycastle', module: 'bcpkix-jdk15on'
    exclude group: 'org.bouncycastle', module: 'bcutil-jdk15on'
    exclude group: 'org.bouncycastle', module: 'bcprov-jdk14'
}

dependencies {
    implementation libs.kotlin.stdlib
    implementation libs.kotlinx.coroutines.android

    implementation libs.compose.ui
    implementation libs.compose.ui.graphics
    implementation libs.compose.ui.tooling.preview
    debugImplementation libs.compose.ui.tooling
    implementation libs.compose.foundation
    implementation libs.compose.material3
    implementation libs.compose.material.icons.extended
    implementation libs.androidx.activity.compose
    implementation libs.androidx.lifecycle.viewmodel.compose
    implementation libs.androidx.lifecycle.viewmodel.ktx
    implementation libs.androidx.lifecycle.runtime.compose
    // ProcessLifecycleOwner, for AutoLock.
    implementation libs.androidx.lifecycle.process

    // Required by the vendored Zodl design library.
    implementation libs.compose.ui.text.google.fonts
    implementation libs.kotlinx.collections.immutable
    implementation libs.compose.shimmer
    implementation libs.lottie.compose

    // The window theme, and FragmentActivity for BiometricPrompt.
    implementation libs.androidx.appcompat
    implementation libs.material
    implementation libs.androidx.biometric

    // On-device Noir/Barretenberg (UltraHonk) proving for passport proof-of-personhood.
    // VERSION LOCKSTEP: on-device proofs verify on-chain only when this AAR's bb
    // matches the chain verifier's bb (third_party/barretenberg-go, v5.0.0 FINAL).
    // This release's native lib is built against barretenberg-rs 5.0.0 (verified:
    // `strings jni/*/libnoir_java.so` -> barretenberg-rs-5.0.0), i.e. bb v5.0.0
    // final — aligned. A *nightly* bb produces proofs the v5.0.0 chain lib rejects
    // for large circuits, so if you bump noir_android, confirm it still ships
    // barretenberg-rs 5.0.0-final (do NOT move the chain to a nightly to compensate).
    implementation libs.noir.android

    // BIP-32/39 key derivation.
    implementation(libs.bitcoinj.core) { exclude group: 'org.bouncycastle' }

    // ePassport reading. scuba-sc-android replaces the transport JMRTD pulls in.
    implementation(libs.jmrtd) {
        exclude group: 'net.sf.scuba', module: 'scuba-sc-android'
    }
    implementation libs.scuba.sc.android
    implementation libs.bouncycastle.bcprov
    implementation libs.bouncycastle.bcpkix
    // SLF4J binding for JMRTD's logging.
    implementation libs.slf4j.android

    // Cosmos SDK transaction encoding.
    implementation libs.protobuf.javalite

    // Base64 for the gas-grant request body. android.util.Base64 is a stub in
    // JVM unit tests and java.util.Base64 needs API 26.
    implementation libs.okio

    // QR codes: generating them, and scanning addresses.
    implementation libs.zxing.core
    implementation libs.zxing.android.embedded

    // MRZ scanning. The unbundled Play Services model, for 16 KB page support.
    implementation libs.mlkit.text.recognition
    implementation libs.androidx.camera.core
    implementation libs.androidx.camera.camera2
    implementation libs.androidx.camera.lifecycle
    implementation libs.androidx.camera.view

    // Play in-app updates, checked by UpdateCheckActivity.
    implementation libs.play.app.update
    implementation libs.play.app.update.ktx

    // Play install referrer: carries the `referrer` parameter of a store link
    // through the install so a first launch knows who referred it.
    implementation libs.installreferrer

    testImplementation libs.junit
    // android.jar's org.json is stubs that throw in a JVM test; this is the
    // real implementation, on the unit-test classpath only.
    testImplementation libs.json
    androidTestImplementation libs.androidx.test.junit
}
