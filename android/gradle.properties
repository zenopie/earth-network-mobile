# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.enableJetifier=true
android.suppressUnsupportedCompileSdk=34,35# BouncyCastle's jdk18on jars are multi-release, with class files newer than
# Jetifier can parse. They have no support-library references to rewrite.
android.jetifier.ignorelist=bcprov-jdk18on,bcpkix-jdk18on,bcutil-jdk18on
