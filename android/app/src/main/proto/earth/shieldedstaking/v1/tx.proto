syntax = "proto3";
package earth.shieldedstaking.v1;

option java_package = "network.erth.earth.proto.shieldedstaking";
option java_multiple_files = true;

import "cosmos/gov/v1/tx.proto";
import "earth/allocation/v1/tx.proto";
import "earth/shielded/v1/tx.proto";

// Clean proto3 mirrors of the chain's x/shieldedstaking messages
// (wire-compatible). All are private msgs: unsigned, a bundle paying the fee
// (a delegation's also releasing the ERTH it stakes), a stake proof over the
// module's owner-locked stake note tree. Every sighash binds the stake
// proof's StakeFields first (anchor, nf_0, nf_1, cm_0, cm_1, Bytes(ct_0),
// Bytes(ct_1), spc_mint, owner_tag, Bytes(spc_ciphertext)), then the msg's
// own fields. No msg names a fee: it is the bundle's uerth balance less what
// the msg moves (a delegation's amount).

// StakeProof is a circuits/stake proof and its public values. The chain
// supplies asset, v_in (0), v_out and the sighash. Public input order:
// anchor, asset, nf_0, nf_1, cm_out_0, cm_out_1, v_in, v_out, spc_mint,
// owner_tag, sighash.
message StakeProof {
  bytes proof = 1;
  bytes anchor = 2;
  repeated bytes nullifiers = 3;
  repeated bytes commitments = 4;
  repeated bytes ciphertexts = 5;
  bytes spc_mint = 6;
  bytes owner_tag = 7;
  // The blind stake ciphertext (177 bytes) of the note minted to spc_mint:
  // required on Delegate and UnlockPosition; empty otherwise (spc_mint is
  // proven for every msg but used only by those two).
  bytes spc_ciphertext = 8;
}

// sighash fields: StakeFields, Bytes(validator), amount.
message MsgDelegate {
  earth.shielded.v1.Bundle bundle = 1;
  string validator = 2;
  reserved 3;
  StakeProof stake = 4;
  uint64 amount = 5;
}

// sighash fields: StakeFields, Bytes(validator).
message MsgRestake {
  earth.shielded.v1.Bundle bundle = 1;
  string validator = 2;
  reserved 3;
  StakeProof stake = 4;
}

// The chain pays the undelegation out by itself at maturity: value x
// payout / requested uerth as pool notes to pc with ciphertext (several notes
// of at most 2^63-1, the same ciphertext, when it is split). No stake note is
// minted: stake.spc_ciphertext is empty, stake.spc_mint is unused.
// sighash fields: StakeFields, Bytes(validator), amount, pc, Bytes(ciphertext).
message MsgUndelegate {
  earth.shielded.v1.Bundle bundle = 1;
  string validator = 2;
  uint64 amount = 3;
  reserved 4;
  StakeProof stake = 5;
  // The payout notes' pc (32 bytes) and amount-blind v2 ciphertext (177 bytes).
  bytes pc = 6;
  bytes ciphertext = 7;
}

// MsgClaimUnbonding is retired (chain 48b631c): undelegations pay out by
// themselves.

// Up to four stake notes of one owner at one validator vote with ONE weight,
// without being spent (ORCHARD_DESIGN 18.2): proof is circuits/vote against
// the proposal's snapshot (note root, nullifier tree root). vote_nullifiers:
// exactly four, the used slots' H(TAG_VNF, nk, rho, position, proposal_id)
// first (distinct), then zeros; each refused a second time on the proposal
// (code 1119). weight: the notes' sum rounded down to three significant
// digits. Nothing is spent or minted.
// sighash fields (no StakeFields): proposal_id, Bytes(validator),
// Bytes(OptionsBytes(options)), weight, vote_nullifiers[0..3].
message MsgStakeVote {
  earth.shielded.v1.Bundle bundle = 1;
  uint64 proposal_id = 2;
  string validator = 3;
  repeated cosmos.gov.v1.WeightedVoteOption options = 4;
  uint64 weight = 5;
  reserved 6;
  // stake (7): the spend-to-vote stake proof, gone.
  reserved 7;
  bytes proof = 8;
  // vote_nullifier (9): the one-note vote's, replaced by vote_nullifiers.
  reserved 9;
  repeated bytes vote_nullifiers = 10;
}

// sighash fields: StakeFields, Bytes(validator), amount,
// Bytes(SplitsBytes(splits)).
message MsgLockPosition {
  earth.shielded.v1.Bundle bundle = 1;
  string validator = 2;
  uint64 amount = 3;
  repeated earth.allocation.v1.AllocationWeight splits = 4;
  reserved 5;
  StakeProof stake = 6;
}

// sighash fields: StakeFields, position_id, Bytes(SplitsBytes(splits)).
message MsgUpdatePosition {
  earth.shielded.v1.Bundle bundle = 1;
  uint64 position_id = 2;
  repeated earth.allocation.v1.AllocationWeight splits = 3;
  reserved 4;
  StakeProof stake = 5;
}

// sighash fields: StakeFields, position_id.
message MsgUnlockPosition {
  earth.shielded.v1.Bundle bundle = 1;
  uint64 position_id = 2;
  reserved 3;
  StakeProof stake = 4;
}

// sighash fields: StakeFields, position_id, proposal_id,
// Bytes(OptionsBytes(options)).
message MsgPositionVote {
  earth.shielded.v1.Bundle bundle = 1;
  uint64 position_id = 2;
  uint64 proposal_id = 3;
  repeated cosmos.gov.v1.WeightedVoteOption options = 4;
  reserved 5;
  StakeProof stake = 6;
}
