syntax = "proto3";
package earth.personhood.v1;

option java_package = "network.erth.earth.proto.personhood";
option java_multiple_files = true;

import "earth/allocation/v1/tx.proto";
import "earth/shielded/v1/tx.proto";

// Clean proto3 mirrors of the chain's x/personhood messages (wire-compatible;
// gogoproto/cosmos_proto annotations omitted so protobuf-javalite generates
// cleanly on Android).
//
// Every message here is private: unsigned, alone in its tx, its fee paid from
// the shielded pool by the Transfer it embeds. Nothing names an address of the
// person acting; the signal (zk/privacy.ActionSignal) binds every field.

// Membership is an anonymous proof of holding a live identity-tree leaf. The
// chain supplies scope, signal, exclusions and max_activation itself.
message Membership {
  bytes proof = 1;
  bytes root = 2;
  bytes nullifier = 3;
}

// MsgRegister registers a passport. The passport proof's `address` input is
// zk/privacy.RegistrationBinding(idc, pc_anml, pc_erth, Bytes(affiliate) | 0).
message MsgRegister {
  earth.shielded.v1.Transfer fee = 1;
  bytes proof = 2;
  // Public inputs as decimal strings: [current_date, address, nullifier, dsc_key] for lean_poa.
  repeated string public_signals = 3;
  string signature_algorithm = 4;
  bytes dsc_der = 5;
  bytes idc = 6;
  bytes pc_anml = 7;
  bytes ciphertext_anml = 8;
  bytes pc_erth = 9;
  bytes ciphertext_erth = 10;
  string affiliate = 13;
  reserved 11, 12;
}

// MsgClaimAnml mints 1 ANML to pc, once per person per UTC day.
message MsgClaimAnml {
  earth.shielded.v1.Transfer fee = 1;
  Membership membership = 2;
  uint64 day = 3;
  bytes pc = 4;
  bytes ciphertext = 5;
}

// MsgSetCaretaker casts, replaces or (empty) clears a caretaker split.
message MsgSetCaretaker {
  earth.shielded.v1.Transfer fee = 1;
  Membership membership = 2;
  repeated earth.allocation.v1.AllocationWeight percentages = 3;
  uint64 max_activation = 4;
}

// MsgBindReferrer binds (or, empty, clears) the prover's referral address.
message MsgBindReferrer {
  earth.shielded.v1.Transfer fee = 1;
  Membership membership = 2;
  string address = 3;
  uint64 max_activation = 4;
}
