syntax = "proto3";
package earth.personhood.v1;

option java_package = "network.erth.earth.proto.personhood";
option java_multiple_files = true;

import "earth/allocation/v1/tx.proto";
import "earth/shielded/v1/tx.proto";

// Clean proto3 mirrors of the chain's x/personhood messages (wire-compatible;
// gogoproto/cosmos_proto annotations omitted so protobuf-javalite generates
// cleanly on Android).
//
// Every message here is private: unsigned, alone in its tx, its fee paid from
// the shielded pool by the fee Bundle it embeds (whose only balance is the
// uerth fee). The sighash (zk/orchard.Sighash) binds every field, and any
// membership proof binds it as its signal.

// Membership is an anonymous proof of holding a live identity-tree leaf. The
// chain supplies scope, signal, exclusions and both bounds itself.
message Membership {
  bytes proof = 1;
  bytes root = 2;
  bytes nullifier = 3;
}

// MsgRegister registers a passport. The passport proof's `address` input is
// zk/privacy.RegistrationBinding(idc, pc_anml, Bytes(ct_anml), pc_erth,
// Bytes(ct_erth), affiliate), affiliate = 0 for no referrer, else
// H(TAG_AFFILIATE, Bytes(affiliate_handle), affiliate_pc, Bytes(affiliate_ciphertext)).
// sighash fields: idc, pc_anml, Bytes(ciphertext_anml), pc_erth,
// Bytes(ciphertext_erth), affiliate, Bytes(signature_algorithm), public signals.
message MsgRegister {
  earth.shielded.v1.Bundle fee = 1;
  bytes proof = 2;
  repeated string public_signals = 3;
  string signature_algorithm = 4;
  bytes dsc_der = 5;
  bytes idc = 6;
  bytes pc_anml = 7;
  bytes ciphertext_anml = 8;
  bytes pc_erth = 9;
  bytes ciphertext_erth = 10;
  // The referrer: a live handle, empty for none. The chain mints the
  // referrer's half itself, to the handle's address (privacy
  // ReferralOpening); the registrant's wallet makes no note for it.
  string affiliate_handle = 15;
  // affiliate_pc / affiliate_ciphertext (chain 203d3b2), affiliate,
  // affiliate_code: removed.
  reserved 11, 12, 13, 14;
}

// sighash fields: day, pc, Bytes(ciphertext).
message MsgClaimAnml {
  earth.shielded.v1.Bundle fee = 1;
  Membership membership = 2;
  uint64 day = 3;
  bytes pc = 4;
  bytes ciphertext = 5;
}

// sighash fields: per entry, option_id then percent.
message MsgSetCaretaker {
  earth.shielded.v1.Bundle fee = 1;
  Membership membership = 2;
  repeated earth.allocation.v1.AllocationWeight percentages = 3;
  reserved 4;
  uint64 max_predecessor = 5;
}

// MoveProof is a move circuit proof (circuits/move): its prover knows the
// identity secrets of an identity and of the identity that succeeded it under
// the same passport (the chain's succession leaf H(TAG_SUCC, idc_old, idc_new)
// and the successor's live identity leaf are both in the tree at root).
// Public inputs, in order: root, scope (the msg's), old_nullifier,
// new_nullifier, signal (the msg's sighash). The chain defines it in
// registration.proto; the same package, so the wire is the same.
message MoveProof {
  bytes proof = 1;
  bytes root = 2;
  bytes old_nullifier = 3;
  bytes new_nullifier = 4;
}

// Hands the live caretaker split of old_nullifier, percentages and expiry
// unchanged, to new_nullifier, its successor under the same passport, in the
// caretaker scope. sighash fields: none beyond the fee bundle's.
message MsgMoveCaretaker {
  earth.shielded.v1.Bundle fee = 1;
  MoveProof move = 2;
}

// Claims, renews, changes or (both empty) releases the prover's handle.
// sighash fields: Bytes(handle), owner_pk, Bytes(ek_pub) (Bytes of nothing,
// 0 and Bytes of nothing for a release).
message MsgBindHandle {
  earth.shielded.v1.Bundle fee = 1;
  Membership membership = 2;
  string handle = 3;
  string address = 4;
  reserved 5;
  uint64 max_predecessor = 6;
}

// Hands a live handle, lease unchanged, from old_nullifier to new_nullifier,
// its successor under the same passport, in the handle scope. sighash
// fields: Bytes(handle).
message MsgMoveHandle {
  earth.shielded.v1.Bundle fee = 1;
  MoveProof move = 2;
  string handle = 3;
}
