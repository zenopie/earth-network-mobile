syntax = "proto3";
package earth.shielded.v1;

option java_package = "network.erth.earth.proto.shielded";
option java_multiple_files = true;

import "cosmos/base/v1beta1/coin.proto";

// Clean proto3 mirrors of the chain's x/shielded types (wire-compatible;
// gogoproto/cosmos_proto annotations omitted so protobuf-javalite generates
// cleanly on Android). The chain's earth/shielded/v1/shielded.proto and
// tx.proto are canonical.

// Action is one spend and one output of a bundle (circuits/action). Public
// inputs: anchor, nullifier, commitment, cv_x, cv_y, sighash.
message Action {
  bytes anchor = 1;
  bytes nullifier = 2;
  bytes commitment = 3;
  // cv = v_spend*G(asset_spend) - v_out*G(asset_out) + rcv*R, x || y.
  bytes cv = 4;
  bytes ciphertext = 5;
  bytes proof = 6;
}

// ValueBalance is value of one denom leaving the pool through a bundle.
message ValueBalance {
  string denom = 1;
  uint64 amount = 2;
}

// Bundle: >= 2 actions, one positive balance per denom, and the binding
// signature (Rn.x || Rn.y || s, 96 bytes) over the msg's sighash.
message Bundle {
  repeated Action actions = 1;
  repeated ValueBalance balances = 2;
  bytes binding_sig = 3;
}

message MsgShield {
  string sender = 1;
  cosmos.base.v1beta1.Coin amount = 2;
  bytes pc = 3;
  bytes ciphertext = 4;
}

// MsgSend: a private send and optionally an unshield. The bundle's uerth
// balance pays fee; every other unit of every balance goes to receiver.
// sighash fields: Bytes(receiver address bytes), fee.
message MsgSend {
  Bundle bundle = 1;
  string receiver = 2;
  uint64 fee = 3;
}
