syntax = "proto3";
package earth.assembly.v1;

option java_package = "network.erth.earth.proto.assembly";
option java_multiple_files = true;

import "earth/personhood/v1/tx.proto";
import "earth/shielded/v1/tx.proto";

// Clean proto3 mirrors of the chain's x/assembly messages (wire-compatible;
// gogoproto/cosmos_proto annotations omitted so protobuf-javalite generates
// cleanly on Android).
//
// The assembly is the chain's second governance house: one live
// proof-of-personhood registration is one vote, and every x/gov proposal needs
// two thirds of the human votes cast on it before x/gov's own result is allowed
// to take effect. Stake weighs nothing here. Every message is private: a
// membership proof in the ballot's scope, the fee paid from a shielded note.

// There is no abstain. Approval is two thirds of the votes cast, so abstaining
// and not voting come to identical arithmetic.
enum VoteOption {
  VOTE_OPTION_UNSPECIFIED = 0;
  VOTE_OPTION_YES = 1;
  VOTE_OPTION_NO = 2;
}

message MsgVoteProposal {
  earth.shielded.v1.Transfer fee = 1;
  earth.personhood.v1.Membership membership = 2;
  uint64 proposal_id = 3;
  VoteOption option = 4;
}

message MsgProposeRemoval {
  earth.shielded.v1.Transfer fee = 1;
  earth.personhood.v1.Membership membership = 2;
  uint64 option_id = 3;
}

message MsgVoteRemoval {
  earth.shielded.v1.Transfer fee = 1;
  earth.personhood.v1.Membership membership = 2;
  uint64 option_id = 3;
  VoteOption option = 4;
}
