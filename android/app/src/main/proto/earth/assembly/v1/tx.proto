syntax = "proto3";
package earth.assembly.v1;

option java_package = "network.erth.earth.proto.assembly";
option java_multiple_files = true;

// Clean proto3 mirrors of the earth chain's x/assembly messages (wire-compatible;
// gogoproto/cosmos_proto annotations omitted so protobuf-javalite generates
// cleanly on Android).
//
// The assembly is the chain's second governance house: one live
// proof-of-personhood registration is one vote, and every x/gov proposal needs
// two thirds of the human votes cast on it before x/gov's own result is allowed
// to take effect. Stake weighs nothing here.

// There is no abstain. Approval is two thirds of the votes cast, so abstaining
// and not voting come to identical arithmetic.
enum VoteOption {
  VOTE_OPTION_UNSPECIFIED = 0;
  VOTE_OPTION_YES = 1;
  VOTE_OPTION_NO = 2;
}

// MsgVoteProposal votes on an x/gov proposal as a human.
//
// Not to be confused with cosmos.gov.v1.MsgVote, which is the same proposal's
// other house. Both are cast on the same proposal id and neither substitutes
// for the other.
message MsgVoteProposal {
  string voter = 1;
  uint64 proposal_id = 2;
  VoteOption option = 3;
}

// MsgProposeRemoval opens a ballot to remove a groundworks allocation option.
message MsgProposeRemoval {
  string proposer = 1;
  uint64 option_id = 2;
}

// MsgVoteRemoval votes on an open removal ballot.
message MsgVoteRemoval {
  string voter = 1;
  uint64 option_id = 2;
  VoteOption option = 3;
}
