syntax = "proto3";
package cosmos.gov.v1;

option java_package = "cosmos.gov.v1";
option java_multiple_files = true;

// Trimmed to the types private stake votes carry (x/shieldedstaking), like
// every other vendored proto here. The SDK declares VoteOption in gov.proto,
// but an enum travels as a varint, so declaring it here keeps the file
// self-contained instead of pulling gov.proto and its dependencies in behind it.
enum VoteOption {
  VOTE_OPTION_UNSPECIFIED = 0;
  VOTE_OPTION_YES = 1;
  VOTE_OPTION_ABSTAIN = 2;
  VOTE_OPTION_NO = 3;
  VOTE_OPTION_NO_WITH_VETO = 4;
}

// A weighted vote option, as private stake votes carry (x/shieldedstaking).
// weight is a decimal string, e.g. "0.5".
message WeightedVoteOption {
  VoteOption option = 1;
  string weight = 2;
}
