[versions]
agp = "8.7.3"
kotlin = "2.2.20"
protobuf-plugin = "0.9.5"
# protoc must match the javalite runtime's line.
protobuf = "3.21.12"
coroutines = "1.7.3"

# Compose is pinned per artifact rather than through a BOM: the vendored Zodl
# design library is built against Material 3 1.4.0 and Compose 1.10.4, and its
# modal sheet uses APIs that do not exist in earlier versions.
compose = "1.10.4"
compose-material3 = "1.4.0"
compose-material-icons = "1.7.8"
activity-compose = "1.10.1"
lifecycle = "2.7.0"
camera = "1.4.1"

# VERSION LOCKSTEP: see the comment on noir-android in app/build.gradle.
noir-android = "1.0.0-beta.22-2"
bouncycastle = "1.86"

[libraries]
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-collections-immutable = "org.jetbrains.kotlinx:kotlinx-collections-immutable:0.3.7"

compose-ui = { module = "androidx.compose.ui:ui", version.ref = "compose" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics", version.ref = "compose" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling", version.ref = "compose" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview", version.ref = "compose" }
compose-ui-text-google-fonts = { module = "androidx.compose.ui:ui-text-google-fonts", version.ref = "compose" }
compose-foundation = { module = "androidx.compose.foundation:foundation", version.ref = "compose" }
compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "compose-material3" }
compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended", version.ref = "compose-material-icons" }
compose-shimmer = "com.valentinilk.shimmer:compose-shimmer:1.3.1"
lottie-compose = "com.airbnb.android:lottie-compose:6.4.0"

androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
androidx-appcompat = "androidx.appcompat:appcompat:1.6.1"
androidx-biometric = "androidx.biometric:biometric:1.1.0"
androidx-lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-ktx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
androidx-camera-core = { module = "androidx.camera:camera-core", version.ref = "camera" }
androidx-camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camera" }
androidx-camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camera" }
androidx-camera-view = { module = "androidx.camera:camera-view", version.ref = "camera" }
material = "com.google.android.material:material:1.10.0"

noir-android = { module = "com.github.madztheo:noir_android", version.ref = "noir-android" }
bitcoinj-core = "org.bitcoinj:bitcoinj-core:0.16.3"
jmrtd = "org.jmrtd:jmrtd:0.7.18"
scuba-sc-android = "net.sf.scuba:scuba-sc-android:0.0.23"
bouncycastle-bcprov = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
bouncycastle-bcpkix = { module = "org.bouncycastle:bcpkix-jdk18on", version.ref = "bouncycastle" }
slf4j-android = "org.slf4j:slf4j-android:1.7.36"
protobuf-javalite = { module = "com.google.protobuf:protobuf-javalite", version.ref = "protobuf" }
protobuf-protoc = { module = "com.google.protobuf:protoc", version.ref = "protobuf" }
okio = "com.squareup.okio:okio:3.6.0"

zxing-core = "com.google.zxing:core:3.5.2"
zxing-android-embedded = "com.journeyapps:zxing-android-embedded:4.3.0"
mlkit-text-recognition = "com.google.android.gms:play-services-mlkit-text-recognition:19.0.1"
play-app-update = "com.google.android.play:app-update:2.1.0"
play-app-update-ktx = "com.google.android.play:app-update-ktx:2.1.0"
installreferrer = "com.android.installreferrer:installreferrer:2.2"

junit = "junit:junit:4.13.2"
json = "org.json:json:20260814"
androidx-test-junit = "androidx.test.ext:junit:1.1.5"

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
protobuf = { id = "com.google.protobuf", version.ref = "protobuf-plugin" }
