syntax = "proto3";
package earth.dex.v1;

option java_package = "network.erth.earth.proto.dex";
option java_multiple_files = true;

import "cosmos/base/v1beta1/coin.proto";
import "earth/shielded/v1/tx.proto";

// Clean proto3 mirrors of the earth chain's x/dex messages (wire-compatible).

message MsgSwap {
  string creator = 1;
  cosmos.base.v1beta1.Coin token_in = 2;
  string denom_out = 3;
  string min_amount_out = 4;
}

message MsgCreatePool {
  string creator = 1;
  cosmos.base.v1beta1.Coin amount_a = 2;
  cosmos.base.v1beta1.Coin amount_b = 3;
}

message MsgAddLiquidity {
  string creator = 1;
  uint64 pool_id = 2;
  cosmos.base.v1beta1.Coin amount_a = 3;
  cosmos.base.v1beta1.Coin amount_b = 4;
}

// pc receives the token leg as a note, for a pool whose token is
// shielded-only (ANML, pool 1): required there, refused elsewhere. The
// ERTH leg is paid to creator.
message MsgRemoveLiquidity {
  string creator = 1;
  uint64 pool_id = 2;
  cosmos.base.v1beta1.Coin shares = 3;
  bytes pc = 4;
  bytes ciphertext = 5;
}

// Private (unsigned): bundle releases one asset in (plus the uerth fee, or
// none with fee_from_output) into the dex, swapped for denom_out and minted
// (less fee_from_output) to pc. sighash fields: Bytes(denom_out),
// min_amount_out, pc, Bytes(ciphertext), fee_from_output, fee.
message MsgNoteSwap {
  earth.shielded.v1.Bundle bundle = 1;
  string denom_out = 2;
  uint64 min_amount_out = 3;
  bytes pc = 4;
  bytes ciphertext = 5;
  uint64 fee_from_output = 6;
  uint64 fee = 7;
}

message MsgBuyAnml {
  string creator = 1;
  cosmos.base.v1beta1.Coin token_in = 2;
  string min_amount_out = 3;
  bytes pc = 4;
  bytes ciphertext = 5;
}

// Private (unsigned, one bundle): the bundle's token balance is the token leg,
// its uerth balance less fee the ERTH leg; the LP shares (dexlp/<pool_id>)
// are minted as a note to share_pc; what the ratio does not take is minted
// back to refund_pc. sighash fields: pool_id, Bytes(min_shares), share_pc,
// Bytes(share_ciphertext), refund_pc, Bytes(refund_ciphertext), fee.
message MsgAddLiquidityShielded {
  earth.shielded.v1.Bundle bundle = 1;
  uint64 pool_id = 3;
  string min_shares = 5;
  bytes refund_pc = 6;
  bytes refund_ciphertext = 7;
  uint64 fee = 8;
  bytes share_pc = 9;
  bytes share_ciphertext = 10;
  reserved 2, 4;
}

// MsgRemoveLiquidityShielded begins a private withdrawal: bundle releases
// dexlp/<pool_id> shares and the uerth fee; at maturity both legs are minted
// as notes to erth_pc and token_pc. sighash fields: pool_id, erth_pc,
// Bytes(erth_ciphertext), token_pc, Bytes(token_ciphertext), fee.
message MsgRemoveLiquidityShielded {
  earth.shielded.v1.Bundle bundle = 1;
  uint64 pool_id = 2;
  uint64 fee = 3;
  bytes erth_pc = 4;
  bytes erth_ciphertext = 5;
  bytes token_pc = 6;
  bytes token_ciphertext = 7;
}
