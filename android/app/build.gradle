plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-parcelize'
    id 'com.google.protobuf' // Protobuf generation plugin
    id 'org.jetbrains.kotlin.plugin.serialization' version '1.9.22'
    // Kotlin 2.x ships the Compose compiler as a plugin; there is no
    // composeOptions/kotlinCompilerExtensionVersion to keep in sync any more.
    id 'org.jetbrains.kotlin.plugin.compose' version '2.2.20'
}

// Load keystore properties
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = 'network.erth.wallet'
    compileSdk = 36

    defaultConfig {
        applicationId = "network.erth.wallet"
        minSdk = 24
        targetSdk = 36
        versionCode = 30
        versionName = "1.0.25"

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildFeatures {

        compose = true

    }


    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release

            // Add version info to APK name for release tracking
            applicationIdSuffix ""
            versionNameSuffix ""
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
        freeCompilerArgs += [
            "-opt-in=kotlin.RequiresOptIn"
        ]
    }
    
    lint {
        abortOnError = false
        checkReleaseBuilds = false
        disable = ['NotificationPermission']
    }

    sourceSets {
        debug {
            java {
                srcDirs = ['build/generated/source/proto/debug/java']
            }
        }
        release {
            java {
                srcDirs = ['build/generated/source/proto/release/java']
            }
        }
    }

    packaging {
        resources {
            excludes += ['META-INF/LICENSE*', 'META-INF/NOTICE*', 'META-INF/DEPENDENCIES', 'META-INF/INDEX.LIST']
        }
    }
}
 
protobuf {
    // Use protoc 3.21.x compatible with protobuf-javalite
    protoc {
        artifact = "com.google.protobuf:protoc:3.21.12"
    }
    // Configure generation to use the lite runtime
    generateProtoTasks {
        all().each { task ->
            task.builtins {
                // Generate Java lite (javalite) sources for Android compatibility
                java {
                    option 'lite'
                }
            }
        }
    }
}

 
// Dependency resolution to avoid BouncyCastle duplicates
configurations.configureEach {
    exclude group: 'org.bouncycastle', module: 'bcprov-jdk15to18'
}

dependencies {
    // Dependency constraints to avoid BouncyCastle conflicts
    constraints {
        implementation('org.bouncycastle:bcprov-jdk15on:1.70')
        implementation('org.bouncycastle:bcpkix-jdk15on:1.70')
    }

    // Kotlin
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3'

    // Android
    // --- Compose ---
    // The BOM pins every compose artifact to one compatible set, so individual
    // compose dependencies below are deliberately version-less.
    // Versions matched to the vendored Zodl design library, which is built
    // against Material 3 1.4.0 — its modal sheet uses APIs that do not exist in
    // earlier versions, so a lower BOM fails to compile rather than degrading.
    implementation 'androidx.compose.ui:ui:1.10.4'
    implementation 'androidx.compose.ui:ui-graphics:1.10.4'
    implementation 'androidx.compose.ui:ui-tooling-preview:1.10.4'
    debugImplementation 'androidx.compose.ui:ui-tooling:1.10.4'
    implementation 'androidx.compose.material3:material3:1.4.0'
    implementation 'androidx.compose.material:material-icons-extended:1.7.8'
    implementation 'androidx.compose.foundation:foundation:1.10.4'
    implementation 'androidx.activity:activity-compose:1.10.1'  // LocalActivity, used by the vendored theme
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.7.0'
    implementation 'androidx.navigation:navigation-compose:2.7.7'

    // Required by the vendored Zodl design library.
    implementation 'androidx.compose.ui:ui-text-google-fonts:1.10.4'
    implementation 'androidx.constraintlayout:constraintlayout-compose:1.0.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-collections-immutable:0.3.7'
    implementation 'com.valentinilk.shimmer:compose-shimmer:1.3.1'
    implementation 'com.airbnb.android:lottie-compose:6.4.0'

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.10.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.7.0'
    implementation 'androidx.fragment:fragment-ktx:1.6.2'
    implementation 'androidx.activity:activity-ktx:1.8.2'
    // Pull-to-refresh for the explorer lists. recyclerview and viewpager2 arrive
    // transitively via material, but swiperefreshlayout does not.
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    // On-device Noir/Barretenberg (UltraHonk) proving for passport proof-of-personhood.
    // VERSION LOCKSTEP: on-device proofs verify on-chain only when this AAR's bb
    // matches the chain verifier's bb (x/anml/zk/ultrahonk / third_party/barretenberg-go,
    // v5.0.0 FINAL). This release's native lib is built against barretenberg-rs 5.0.0
    // (verified: `strings jni/*/libnoir_java.so` -> barretenberg-rs-5.0.0), i.e. bb
    // v5.0.0 final — aligned. A *nightly* bb produces proofs the v5.0.0 chain lib
    // rejects for large circuits, so if you bump noir_android, confirm it still ships
    // barretenberg-rs 5.0.0-final (do NOT move the chain to a nightly to compensate).
    implementation 'com.github.madztheo:noir_android:1.0.0-beta.22-2'

    // Vector Drawable Support
    implementation 'androidx.vectordrawable:vectordrawable:1.1.0'
    
    // Using Material Design filled icons only (no outlined/grey ones)
    
    // Remove these - not needed for icons
    implementation('org.bitcoinj:bitcoinj-core:0.16.3') { exclude group: 'org.bouncycastle' }
    
    // JMRTD library for reading ePassports - stable version
    implementation ('org.jmrtd:jmrtd:0.7.18') {
        exclude group: 'org.bouncycastle', module: 'bcprov-jdk15on'
        exclude group: 'org.bouncycastle', module: 'bcprov-jdk14'
        exclude group: 'org.bouncycastle', module: 'bcpkix-jdk15on'
        exclude group: 'net.sf.scuba', module: 'scuba-sc-android'
    }
    
    // Required dependencies for JMRTD
    implementation 'org.bouncycastle:bcprov-jdk15on:1.70'
    implementation 'org.bouncycastle:bcpkix-jdk15on:1.70'
    implementation 'net.sf.scuba:scuba-sc-android:0.0.23'

    // SLF4J Android binding for JMRTD logging
    implementation 'org.slf4j:slf4j-android:1.7.36'
    
    // For handling images in passport
    implementation 'com.github.mhshams:jnbis:1.1.0'
    // GIF rendering (Glide)
    implementation 'com.github.bumptech.glide:glide:4.15.1'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.15.1'
    
    // QR Code generation
    implementation 'com.google.zxing:core:3.5.2'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    
    // Google AdMob for advertisements
    implementation 'com.google.android.gms:play-services-ads:22.6.0'

    // Google Play In-App Updates
    implementation 'com.google.android.play:app-update:2.1.0'
    implementation 'com.google.android.play:app-update-ktx:2.1.0'
    
    // ML Kit Text Recognition for camera-based MRZ scanning (Play Services unbundled version for 16KB support)
    implementation 'com.google.android.gms:play-services-mlkit-text-recognition:19.0.1'
    // CameraX for camera functionality (updated for 16KB page size support)
    implementation 'androidx.camera:camera-core:1.4.1'
    implementation 'androidx.camera:camera-camera2:1.4.1'
    implementation 'androidx.camera:camera-lifecycle:1.4.1'
    implementation 'androidx.camera:camera-view:1.4.1'
    
    // Protobuf dependencies for Cosmos SDK transaction encoding (lite version for Android)
    implementation 'com.google.protobuf:protobuf-javalite:3.21.12'

    // JSON serialization
    implementation 'com.google.code.gson:gson:2.10.1'

    // HTTP client for passport proof verification + update metadata
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    // Play install referrer: carries the `referrer` parameter of a store link
    // through the install so a first launch knows who referred it.
    implementation 'com.android.installreferrer:installreferrer:2.2'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}