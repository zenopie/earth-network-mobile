syntax = "proto3";
package earth.allocation.v1;

option java_package = "network.erth.earth.proto.allocation";
option java_multiple_files = true;

// Clean proto3 mirrors of the earth chain's x/allocation messages (wire-compatible;
// gogoproto/cosmos_proto annotations omitted so protobuf-javalite generates
// cleanly on Android).
//
// One engine, two streams. The two share no state, so an option id only means
// something together with a stream.

enum StreamId {
  STREAM_ID_UNSPECIFIED = 0;
  // One-human-one-vote. Weight comes from a live proof-of-personhood registration.
  STREAM_ID_CARETAKER = 1;
  // Stake-weighted. Weight is the voter's bonded stake, normalized on-chain.
  STREAM_ID_GROUNDWORKS = 2;
}

message AllocationWeight {
  uint64 option_id = 1;
  uint64 percent = 2;
}

// Adds an ADDRESS option payable to `recipient`. Caretaker is permissionless:
// any account may add one, params.address_option_fee (uerth) burned from the
// submitter's public balance. Groundworks is governance-only.
message MsgAddAddressOption {
  string submitter = 1;
  StreamId stream = 2;
  string description = 3;
  string recipient = 4;
  // Who may trigger the payout; empty lets anyone, and it goes to recipient regardless.
  string claimer = 5;
}

message MsgAddAddressOptionResponse {
  uint64 id = 1;
}

// Triggers an ADDRESS option's payout of what it has accrued, to its
// recipient. Anyone may, unless the option names a claimer.
message MsgClaimAllocation {
  string creator = 1;
  StreamId stream = 2;
  uint64 option_id = 3;
}

message MsgClaimAllocationResponse {}
